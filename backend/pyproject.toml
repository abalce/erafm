[project]
name = "backend"
version = "0.1.0"
description = "Erafm: backend do importu i analizy historii Last.fm"
readme = "README.md"
authors = [
    { name = "Angelika", email = "abalcerzak22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.7",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # kolejność importów
    "UP", # nowocześniejsza składnia Pythona
    "B",  # flake8-bugbear (typowe pułapki)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
